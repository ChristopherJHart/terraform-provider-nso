---
name: Global Settings
path: tailf-ncs:devices/global-settings
res_description: This resource can manage the Global Settings configuration.
ds_description: This data source can read the Global Settings configuration.
no_augment_config: true
no_delete: true
doc_category: Device
attributes:
  - yang_name: connect-timeout
    tf_name: connect_timeout
    type: Int64
    description: Timeout in seconds for new connections.
    example: 60
  - yang_name: read-timeout
    tf_name: read_timeout
    type: Int64
    description: Timeout in seconds used when reading data.
    example: 120
  - yang_name: write-timeout
    tf_name: write_timeout
    type: Int64
    description: Timeout in seconds used when writing data.
    example: 120
  - yang_name: no-wait-for-lock
    tf_name: no_wait_for_lock
    type: Bool
    type_yang_bool: empty
    description: Do not wait for the device lock, fail immediately.
    example: false
  - yang_name: wait-for-lock/timeout
    tf_name: wait_for_lock_timeout
    type: Int64
    description: Timeout in seconds to wait for device lock.
    example: 60
  - yang_name: wait-for-lock/infinity
    tf_name: wait_for_lock_infinity
    type: Bool
    type_yang_bool: empty
    description: Wait indefinitely for the device lock.
    example: false
  - yang_name: ssh/keep-alive-interval
    tf_name: ssh_keep_alive_interval
    type: Int64
    description: The SSH keep alive interval in seconds.
    example: 20
  - yang_name: ssh/keep-alive-count
    tf_name: ssh_keep_alive_count
    type: Int64
    description: The number of SSH keep alive messages before disconnect.
    example: 3
  - yang_name: ssh/algorithms/public-key
    tf_name: ssh_algorithms_public_key
    type: StringList
    description: A list of SSH public key algorithms.
    example: ssh-rsa
  - yang_name: ssh/algorithms/kex
    tf_name: ssh_algorithms_kex
    type: StringList
    description: A list of SSH key exchange algorithms.
    example: diffie-hellman-group14-sha1
  - yang_name: ssh/algorithms/mac
    tf_name: ssh_algorithms_mac
    type: StringList
    description: A list of SSH MAC algorithms.
    example: hmac-sha2-256
  - yang_name: ssh/algorithms/cipher
    tf_name: ssh_algorithms_cipher
    type: StringList
    description: A list of SSH cipher algorithms.
    example: aes256-ctr
  - yang_name: ssh/algorithms/compression
    tf_name: ssh_algorithms_compression
    type: StringList
    description: A list of SSH compression algorithms.
    example: none
  - yang_name: ssh/algorithms/dh-group/min-size
    tf_name: ssh_algorithms_dh_group_min_size
    type: Int64
    description: Minimum size of the DH group.
    example: 1024
  - yang_name: ssh/algorithms/dh-group/preferred-size
    tf_name: ssh_algorithms_dh_group_preferred_size
    type: Int64
    description: Preferred size of the DH group.
    example: 2048
  - yang_name: ssh/algorithms/dh-group/max-size
    tf_name: ssh_algorithms_dh_group_max_size
    type: Int64
    description: Maximum size of the DH group.
    example: 4096
  - yang_name: ned-keep-alive/interval
    tf_name: ned_keep_alive_interval
    type: Int64
    description: The NED keep alive interval in seconds.
    example: 120
  - yang_name: ned-keep-alive/count
    tf_name: ned_keep_alive_count
    type: Int64
    description: The number of NED keep alive messages before disconnect.
    example: 3
  - yang_name: connect-retries/attempts
    tf_name: connect_retries_attempts
    type: Int64
    description: Number of connection retry attempts.
    example: 0
  - yang_name: connect-retries/timeout
    tf_name: connect_retries_timeout
    type: Int64
    description: Timeout in seconds between connection retry attempts.
    example: 3
  - yang_name: trace
    tf_name: trace
    type: String
    description: Trace output control.
    enum_values:
      - raw
      - pretty
      - "false"
    example: "false"
  - yang_name: trace-output
    tf_name: trace_output
    type: String
    description: Where to send trace output.
    enum_values:
      - file
      - stream
    example: file
  - yang_name: ned-settings/use-confirmed-commit
    tf_name: ned_settings_use_confirmed_commit
    type: Bool
    type_yang_bool: empty
    description: Use confirmed commit toward the device.
    example: false
  - yang_name: ned-settings/use-validate
    tf_name: ned_settings_use_validate
    type: Bool
    type_yang_bool: empty
    description: Use validate toward the device.
    example: false
  - yang_name: ned-settings/use-startup
    tf_name: ned_settings_use_startup
    type: Bool
    type_yang_bool: empty
    description: Use startup datastore toward the device.
    example: false
  - yang_name: ned-settings/use-transaction-id
    tf_name: ned_settings_use_transaction_id
    type: Bool
    type_yang_bool: empty
    description: Use transaction ID toward the device.
    example: false
  - yang_name: ned-settings/use-private-candidate
    tf_name: ned_settings_use_private_candidate
    type: Bool
    type_yang_bool: empty
    description: Use private candidate datastore toward the device.
    example: false
  - yang_name: ned-settings/use-junos-rollback
    tf_name: ned_settings_use_junos_rollback
    type: Bool
    type_yang_bool: empty
    description: Use Junos rollback mechanism.
    example: false
  - yang_name: no-overwrite/enabled-by-default
    tf_name: no_overwrite_enabled_by_default
    type: Bool
    type_yang_bool: empty
    description: Enable no-overwrite by default.
    example: false
  - yang_name: no-overwrite/compare
    tf_name: no_overwrite_compare
    type: String
    description: No-overwrite comparison method.
    enum_values:
      - full
      - revision
    example: full
  - yang_name: lsa/no-overwrite/enabled-by-default
    tf_name: lsa_no_overwrite_enabled_by_default
    type: Bool
    type_yang_bool: empty
    description: Enable LSA no-overwrite by default.
    example: false
  - yang_name: lsa/no-overwrite/compare
    tf_name: lsa_no_overwrite_compare
    type: String
    description: LSA no-overwrite comparison method.
    enum_values:
      - full
      - revision
    example: full
  - yang_name: out-of-sync-commit-behaviour
    tf_name: out_of_sync_commit_behaviour
    type: String
    description: How to handle out-of-sync devices during commit.
    enum_values:
      - reject
      - accept
    example: reject
  - yang_name: use-lsa
    tf_name: use_lsa
    type: Bool
    type_yang_bool: empty
    description: Use LSA (Layered Service Architecture).
    example: false
  - yang_name: no-lsa
    tf_name: no_lsa
    type: Bool
    type_yang_bool: empty
    description: Disable LSA.
    example: false
  - yang_name: session-limits/max-sessions
    tf_name: session_limits_max_sessions
    type: Int64
    description: Maximum number of concurrent sessions.
    example: 0
  - yang_name: session-limits/connect-rate/burst
    tf_name: session_limits_connect_rate_burst
    type: Int64
    description: Maximum burst of connections allowed.
    example: 0
  - yang_name: session-limits/max-wait-time
    tf_name: session_limits_max_wait_time
    type: Int64
    description: Maximum time in seconds to wait for a session.
    example: 0
  - yang_name: session-pool/max-sessions
    tf_name: session_pool_max_sessions
    type: Int64
    description: Maximum number of pooled sessions.
    example: 0
  - yang_name: session-pool/idle-time
    tf_name: session_pool_idle_time
    type: Int64
    description: Idle time in seconds before a pooled session is closed.
    example: 0
  - yang_name: session-pool/pool/max-sessions
    tf_name: session_pool_pool_max_sessions
    type: Int64
    description: Maximum number of sessions in the connection pool.
    example: 0
  - yang_name: commit-queue/enabled-by-default
    tf_name: commit_queue_enabled_by_default
    type: Bool
    type_yang_bool: empty
    description: Enable commit queue by default.
    example: false
  - yang_name: commit-queue/atomic
    tf_name: commit_queue_atomic
    type: Bool
    type_yang_bool: boolean
    description: Whether commit queue operations are atomic.
    example: true
  - yang_name: commit-queue/retry/attempts
    tf_name: commit_queue_retry_attempts
    type: Int64
    description: Number of commit queue retry attempts.
    example: 0
  - yang_name: commit-queue/retry/timeout
    tf_name: commit_queue_retry_timeout
    type: Int64
    description: Timeout in seconds between commit queue retry attempts.
    example: 30
  - yang_name: commit-queue/error-option
    tf_name: commit_queue_error_option
    type: String
    description: Commit queue error handling option.
    enum_values:
      - continue-on-error
      - rollback-on-error
      - stop-on-error
    example: continue-on-error
  - yang_name: commit-retries/attempts
    tf_name: commit_retries_attempts
    type: Int64
    description: Number of commit retry attempts.
    example: 0
  - yang_name: commit-retries/timeout
    tf_name: commit_retries_timeout
    type: Int64
    description: Timeout in seconds between commit retry attempts.
    example: 3
  - yang_name: trace-dir
    tf_name: trace_dir
    type: String
    description: The directory for trace output files.
    example: ./logs
  - yang_name: report-multiple-errors
    tf_name: report_multiple_errors
    type: Bool
    type_yang_bool: empty
    description: Report multiple errors.
    example: false
